<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>떼 날적이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (v10 modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDoc, doc, updateDoc, deleteDoc, 
      query, orderBy, onSnapshot, serverTimestamp, increment, arrayUnion 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDNt6L0hXlZ0lak-F_LIUWyzZuKYiBkRZs",
      authDomain: "tte-naljeoki.firebaseapp.com",
      projectId: "tte-naljeoki",
      storageBucket: "tte-naljeoki.firebasestorage.app",
      messagingSenderId: "157232066568",
      appId: "1:157232066568:web:981e0366865a64d327e1bd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.fs = { collection, addDoc, getDoc, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp, increment, arrayUnion };
    window.dispatchEvent(new Event("firebase-ready"));
  </script>

  <style>
    :root {
      --bg: #F9F8F5;
      --card-bg: #FFFFFF;
      --text: #2C2825;
      --text-sub: #78716C;
      --primary: #945D40;
      --primary-light: #F4ECE6;
      --border: #E8E5DF;
      --shadow: 0 4px 16px rgba(0,0,0,0.05);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    #app-container {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    header {
      position: sticky;
      top: 0;
      background: rgba(249, 248, 245, 0.95);
      backdrop-filter: blur(8px);
      z-index: 50;
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .brand span { font-size: 24px; }
    .btn-write {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(148, 93, 64, 0.3);
    }
    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 18px 8px;
      overflow-x: auto;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: 600;
    }

    .search-bar-wrap {
      padding: 4px 18px 10px;
      display: flex;
      align-items: center;
    }
    .search-input-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      gap: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .search-input-box svg {
      width: 15px;
      height: 15px;
      stroke: var(--text-sub);
      flex-shrink: 0;
    }
    .search-input-box input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
    }
    .search-clear-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
      display: none;
      padding: 0 2px;
    }

    .post-list {
      padding: 4px 18px 80px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: transform 0.1s ease;
      box-shadow: var(--shadow);
    }
    .post-card:active { transform: scale(0.99); }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .badge {
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-notice { background: #FEE2E2; color: #DC2626; }
    .badge-naljeoki { background: var(--primary-light); color: var(--primary); }
    .badge-poll { background: #E0E7FF; color: #4338CA; }
    .post-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .post-content-preview {
      font-size: 14px;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      border-top: 1px solid #FAF7F2;
      padding-top: 10px;
    }
    .post-stats { display: flex; gap: 10px; }
    .thumb-preview {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      float: right;
      margin-left: 10px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .gallery-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.1s ease;
    }
    .gallery-card:active { transform: scale(0.98); }
    .gallery-card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ECE7DE;
    }
    .gallery-card-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gallery-count-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
    }
    .gallery-card-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .gallery-card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gallery-card-sub {
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
    }
    
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-sub);
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--text-sub); }
    .form-input, .form-textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--primary); }
    .form-textarea { height: 140px; resize: none; }
    .radio-group { display: flex; gap: 8px; }
    .radio-label {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .radio-label input { display: none; }
    .radio-label.checked {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .img-upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: var(--bg);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
    }
    .preview-box { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
    .preview-item { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .preview-item button {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #000;
      color: #fff;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 10px;
      cursor: pointer;
    }
    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .loading-notice {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: 14px;
    }
    .poll-builder {
      display: none;
      background: #FAF7F2;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      flex-direction: column;
      gap: 8px;
    }
    .poll-opt-input {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .poll-opt-input input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
    }
    .btn-add-opt {
      background: none;
      border: 1px dashed var(--primary);
      color: var(--primary);
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .detail-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    
    .content-link {
      color: #2563EB;
      text-decoration: underline;
      word-break: break-all;
    }
    .content-link:hover {
      color: #1D4ED8;
    }

    .detail-gallery { 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
      margin: 12px 0; 
    }
    .detail-photo-wrapper {
      position: relative;
      background: #F1EEE9;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .detail-photo-wrapper img {
      width: 100%;
      height: auto;
      max-height: 480px;
      object-fit: contain;
      display: block;
      background: #ECE7DE;
    }

    .photo-zoom-icon-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .detail-photo-wrapper:hover .photo-zoom-icon-btn {
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.08);
    }
    .photo-zoom-icon-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
    }
    
    /* 풀스크린 이미지 뷰어 (핀치 줌 / 드래그 지원) */
    .image-viewer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none; /* 브라우저 기본 제스처 차단 */
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .image-viewer-overlay.open { display: flex; }
    .viewer-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 210;
      pointer-events: auto;
    }
    .btn-download-photo {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .viewer-close-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      font-size: 24px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-img-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: none;
      user-select: none;
    }
    .viewer-img-container img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transform-origin: center center;
      cursor: grab;
      will-change: transform;
      transition: transform 0.05s ease-out;
    }
    .viewer-img-container img:active {
      cursor: grabbing;
    }

    .detail-poll-box {
      background: #FDFBF7;
      border: 1px solid #EBE6DC;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 10px 0;
    }
    .poll-card-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .poll-option-row {
      position: relative;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .poll-option-row.voted {
      border-color: var(--primary);
      box-shadow: 0 0 0 1.5px var(--primary);
      font-weight: 700;
    }
    .poll-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: var(--primary-light);
      opacity: 0.75;
      z-index: 1;
      transition: width 0.4s ease;
    }
    .poll-opt-text { position: relative; z-index: 2; font-size: 14px; color: var(--text); }
    .poll-opt-count { position: relative; z-index: 2; font-size: 13px; font-weight: 600; color: var(--primary); }
    
    .voter-names-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding-left: 6px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .voter-pill {
      background: #EFECE6;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 11px;
      color: #555;
    }
    .voter-pill.me {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }
    .poll-meta-summary { 
      font-size: 12px; 
      color: var(--text-sub); 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      margin-top: 4px; 
    }

    .comment-item {
      background: #F6F4F0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 8px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <header>
      <div class="brand">
        <span>📖</span>
        <div>떼 날적이</div>
      </div>
      <button class="btn-write" id="open-write-modal">✏ 글쓰기</button>
    </header>

    <div class="category-tabs">
      <button class="tab-btn active" data-cat="all">전체</button>
      <button class="tab-btn" data-cat="공지사항">📢 공지사항</button>
      <button class="tab-btn" data-cat="날적이">📖 날적이</button>
      <button class="tab-btn" data-cat="투표">📊 투표</button>
      <button class="tab-btn" data-cat="gallery">🖼️ 갤러리</button>
    </div>

    <div class="search-bar-wrap">
      <div class="search-input-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="제목이나 본문, 작성자 검색...">
        <button class="search-clear-btn" id="search-clear-btn">&times;</button>
      </div>
    </div>

    <div class="post-list" id="post-list">
      <div class="loading-notice">기록을 불러오는 중입니다...</div>
    </div>
  </div>

  <!-- 글쓰기 / 글수정 모달 -->
  <div class="modal-overlay" id="write-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="write-modal-title">새 글 남기기</div>
        <button class="modal-close" id="close-write-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="radio-group" id="radio-group-container">
          <label class="radio-label checked" id="lbl-naljeoki">
            <input type="radio" name="cat" value="날적이" checked> 📖 날적이
          </label>
          <label class="radio-label" id="lbl-notice">
            <input type="radio" name="cat" value="공지사항"> 📢 공지사항
          </label>
          <label class="radio-label" id="lbl-poll">
            <input type="radio" name="cat" value="투표"> 📊 투표
          </label>
        </div>

        <div class="poll-builder" id="poll-builder-area">
          <label style="font-size:12px; font-weight:700; color:var(--text);">투표 선택지 (최대 5개 / 복수투표 지원)</label>
          <div id="poll-options-inputs">
            <div class="poll-opt-input"><input type="text" class="opt-val" placeholder="항목 1 (예: 토요일 저녁 6시)"></div>
            <div class="poll-opt-input"><input type="text" class="opt-val" placeholder="항목 2 (예: 일요일 점심 12시)"></div>
          </div>
          <button type="button" class="btn-add-opt" id="btn-add-poll-option">+ 선택지 추가</button>
        </div>

        <div class="form-group">
          <label>작성자 / 4자리 비밀번호</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="post-author" class="form-input" placeholder="이름" style="flex:1;">
            <input type="password" id="post-pin" class="form-input" placeholder="PIN 4자리" maxlength="4" style="width:100px;">
          </div>
        </div>
        <div class="form-group">
          <label>제목</label>
          <input type="text" id="post-title" class="form-input" placeholder="제목을 입력하세요">
        </div>
        <div class="form-group">
          <label>내용</label>
          <textarea id="post-content" class="form-textarea" placeholder="우리들의 생각과 이야기를 남겨주세요... (링크를 넣으면 클릭할 수 있게 연결됩니다)"></textarea>
        </div>
        <div class="form-group" id="image-upload-group">
          <label class="img-upload-btn">
            📷 사진 첨부하기
            <input type="file" id="post-images" accept="image/*" multiple style="display:none;">
          </label>
          <div class="preview-box" id="image-preview"></div>
        </div>
        <button class="btn-submit" id="submit-post">기록 남기기</button>
      </div>
    </div>
  </div>

  <!-- 글 상세보기 모달 -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title" id="detail-category-badge"></div>
        <button class="modal-close" id="close-detail-modal">&times;</button>
      </div>
      <div class="detail-body">
        <h2 id="detail-title" style="font-size:18px; font-weight:700;"></h2>
        <div id="detail-meta" style="font-size:12px; color:var(--text-sub);"></div>
        <div id="detail-content" style="font-size:15px; line-height:1.6; white-space:pre-wrap; margin:10px 0;"></div>
        
        <div id="detail-poll-container"></div>
        <div class="detail-gallery" id="detail-gallery"></div>

        <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:12px;">
          <button id="detail-like-btn" style="background:#FFF0F0; border:1px solid #FFD1D1; color:#E11D48; padding:6px 12px; border-radius:16px; cursor:pointer; font-weight:600; font-size:13px;">❤ 좋아요 <span id="detail-like-count">0</span></button>
          <div style="display:flex; gap:10px;">
            <button id="detail-edit-btn" style="background:none; border:none; color:var(--primary); font-size:13px; font-weight:600; cursor:pointer;">글 수정</button>
            <button id="detail-delete-btn" style="background:none; border:none; color:var(--text-sub); font-size:13px; cursor:pointer;">글 삭제</button>
          </div>
        </div>
        <div style="margin-top:10px;">
          <h4 style="font-size:14px; margin-bottom:8px;">댓글</h4>
          <div id="detail-comments-list"></div>
          <div style="display:flex; gap:6px; margin-top:8px;">
            <input type="text" id="comment-author" class="form-input" placeholder="이름" style="width:80px; padding:8px;">
            <input type="text" id="comment-text" class="form-input" placeholder="따뜻한 댓글을 남겨보세요" style="flex:1; padding:8px;">
            <button id="comment-submit" style="background:var(--primary); color:#fff; border:none; border-radius:8px; padding:0 12px; cursor:pointer; font-weight:600;">등록</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 전체화면 이미지 확대 뷰어 모달 (손 확대/핀치 줌 지원) -->
  <div class="image-viewer-overlay" id="image-viewer-modal">
    <div class="viewer-header">
      <a href="#" download="날적이_사진.jpg" class="btn-download-photo" id="viewer-download-link">⬇️ 저장하기</a>
      <button class="viewer-close-btn" id="viewer-close-btn">&times;</button>
    </div>
    <div class="viewer-img-container" id="viewer-img-container">
      <img id="viewer-active-img" src="" alt="확대 사진">
    </div>
  </div>

  <script>
    let currentPosts = [];
    let currentCategory = 'all';
    let searchQuery = '';
    let base64Images = [];
    let currentViewingDocId = null;
    let editingPostId = null;

    let myDeviceId = localStorage.getItem('tte_device_id');
    if (!myDeviceId) {
      myDeviceId = 'user_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem('tte_device_id', myDeviceId);
    }
    let mySavedName = localStorage.getItem('tte_saved_username') || '';

    function makeLinksClickable(text) {
      if (!text) return '';
      const escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return escaped.replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="content-link">${url}</a>`;
      });
    }

    const searchInput = document.getElementById('search-input');
    const searchClearBtn = document.getElementById('search-clear-btn');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      searchClearBtn.style.display = searchQuery ? 'block' : 'none';
      renderPosts();
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClearBtn.style.display = 'none';
      renderPosts();
    });

    document.querySelectorAll('input[name="cat"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        document.querySelectorAll('.radio-label').forEach(l => l.classList.remove('checked'));
        e.target.parentElement.classList.add('checked');
        const pollArea = document.getElementById('poll-builder-area');
        if (e.target.value === '투표') {
          pollArea.style.display = 'flex';
        } else {
          pollArea.style.display = 'none';
        }
      });
    });

    document.getElementById('btn-add-poll-option').addEventListener('click', () => {
      const inputs = document.querySelectorAll('.opt-val');
      if (inputs.length >= 5) {
        alert("선택지는 최대 5개까지 추가할 수 있습니다.");
        return;
      }
      const div = document.createElement('div');
      div.className = 'poll-opt-input';
      div.innerHTML = `<input type="text" class="opt-val" placeholder="항목 ${inputs.length + 1}">`;
      document.getElementById('poll-options-inputs').appendChild(div);
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.cat;
        renderPosts();
      });
    });

    document.getElementById('post-images').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 1200;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const compressed = canvas.toDataURL('image/jpeg', 0.75);
            base64Images.push(compressed);
            updateImagePreviews();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function updateImagePreviews() {
      const container = document.getElementById('image-preview');
      container.innerHTML = base64Images.map((src, i) => `
        <div class="preview-item">
          <img src="${src}">
          <button onclick="removeImage(${i})">&times;</button>
        </div>
      `).join('');
    }
    window.removeImage = (idx) => {
      base64Images.splice(idx, 1);
      updateImagePreviews();
    };

    window.addEventListener('firebase-ready', () => {
      const { collection, query, orderBy, onSnapshot } = window.fs;
      const q = query(collection(window.db, "posts"), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        currentPosts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPosts();
        if (currentViewingDocId) {
          const activePost = currentPosts.find(p => p.id === currentViewingDocId);
          if (activePost) openDetailModal(activePost);
        }
      }, (error) => {
        console.error(error);
        document.getElementById('post-list').innerHTML = `<div class="loading-notice">데이터베이스 연결 설정을 확인해 주세요.</div>`;
      });
    });

    function renderPosts() {
      const container = document.getElementById('post-list');

      let filtered = currentPosts;
      if (currentCategory === 'gallery') {
        filtered = filtered.filter(p => p.images && p.images.length > 0);
      } else if (currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategory);
      }

      if (searchQuery) {
        filtered = filtered.filter(p => {
          const title = (p.title || '').toLowerCase();
          const content = (p.content || '').toLowerCase();
          const author = (p.author || '').toLowerCase();
          return title.includes(searchQuery) || content.includes(searchQuery) || author.includes(searchQuery);
        });
      }

      if (filtered.length === 0) {
        container.innerHTML = searchQuery 
          ? `<div class="loading-notice">'${searchQuery}' 검색 결과가 없습니다.</div>`
          : `<div class="loading-notice">아직 등록된 기록이 없습니다.<br>첫 번째 이야기를 남겨보세요!</div>`;
        return;
      }

      if (currentCategory === 'gallery') {
        container.innerHTML = `
          <div class="gallery-grid">
            ${filtered.map(post => {
              const dateStr = post.createdAt ? new Date(post.createdAt.toDate ? post.createdAt.toDate() : post.createdAt).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }) : '';
              return `
                <div class="gallery-card" onclick="selectPost('${post.id}')">
                  <div class="gallery-card-thumb-wrap">
                    <img src="${post.images[0]}" loading="lazy">
                    <span class="gallery-count-badge">📷 ${post.images.length}</span>
                  </div>
                  <div class="gallery-card-info">
                    <div class="gallery-card-title">${post.title}</div>
                    <div class="gallery-card-sub">
                      <span>${post.author || '익명'}</span>
                      <span>${dateStr}</span>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(post => {
        let badgeClass = 'badge-naljeoki';
        if (post.category === '공지사항') badgeClass = 'badge-notice';
        if (post.category === '투표') badgeClass = 'badge-poll';

        const dateStr = post.createdAt ? new Date(post.createdAt.toDate ? post.createdAt.toDate() : post.createdAt).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' }) : '';
        const thumb = post.images && post.images.length > 0 ? `<img src="${post.images[0]}" class="thumb-preview">` : '';

        let uniqueVoters = new Set();
        if (post.poll && post.poll.options) {
          post.poll.options.forEach(opt => {
            (opt.voters || []).forEach(v => uniqueVoters.add(v.id));
          });
        }

        return `
          <div class="post-card" onclick="selectPost('${post.id}')">
            <div class="post-meta">
              <span class="badge ${badgeClass}">${post.category}</span>
              <span>· ${post.author || '익명'}</span>
              <span>· ${dateStr}</span>
            </div>
            ${thumb}
            <div class="post-title">${post.title}</div>
            <div class="post-content-preview">${post.content}</div>
            <div class="post-footer">
              <div class="post-stats">
                <span>❤️ ${post.likes || 0}</span>
                <span>💬 ${(post.comments || []).length}</span>
                ${post.poll ? `<span>📊 참여 ${uniqueVoters.size}명</span>` : ''}
                ${post.images && post.images.length ? `<span>📷 ${post.images.length}</span>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('submit-post').addEventListener('click', async () => {
      const author = document.getElementById('post-author').value.trim();
      const pin = document.getElementById('post-pin').value.trim();
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      const category = document.querySelector('input[name="cat"]:checked').value;

      if (!author || !pin || !title || !content) {
        alert("이름, PIN 4자리, 제목, 내용을 모두 입력해 주세요.");
        return;
      }

      localStorage.setItem('tte_saved_username', author);
      mySavedName = author;

      const { collection, addDoc, doc, updateDoc, serverTimestamp } = window.fs;

      try {
        if (editingPostId) {
          await updateDoc(doc(window.db, "posts", editingPostId), {
            category,
            author,
            pin,
            title,
            content,
            images: base64Images
          });
          alert("수정이 완료되었습니다.");
          editingPostId = null;
        } else {
          let pollData = null;
          if (category === '투표') {
            const optionInputs = Array.from(document.querySelectorAll('.opt-val')).map(i => i.value.trim()).filter(v => v !== '');
            if (optionInputs.length < 2) {
              alert("투표 선택지는 최소 2개 이상 입력해야 합니다.");
              return;
            }
            pollData = {
              options: optionInputs.map(opt => ({ text: opt, voters: [] }))
            };
          }

          await addDoc(collection(window.db, "posts"), {
            category,
            author,
            pin,
            title,
            content,
            poll: pollData,
            images: base64Images,
            likes: 0,
            comments: [],
            createdAt: serverTimestamp()
          });
        }

        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        document.getElementById('post-pin').value = '';
        base64Images = [];
        updateImagePreviews();
        document.getElementById('write-modal').classList.remove('open');
      } catch (err) {
        alert("저장에 실패했습니다: " + err.message);
      }
    });

    window.selectPost = (id) => {
      currentViewingDocId = id;
      const post = currentPosts.find(p => p.id === id);
      if (post) openDetailModal(post);
    };

    function openDetailModal(post) {
      let badgeText = '📖 날적이';
      if (post.category === '공지사항') badgeText = '📢 공지사항';
      if (post.category === '투표') badgeText = '📊 투표';

      document.getElementById('detail-category-badge').innerText = badgeText;
      document.getElementById('detail-title').innerText = post.title;
      document.getElementById('detail-meta').innerText = `${post.author} · ${post.createdAt ? new Date(post.createdAt.toDate ? post.createdAt.toDate() : post.createdAt).toLocaleString('ko-KR') : ''}`;
      
      document.getElementById('detail-content').innerHTML = makeLinksClickable(post.content);
      document.getElementById('detail-like-count').innerText = post.likes || 0;

      const pollContainer = document.getElementById('detail-poll-container');
      if (post.poll && post.poll.options) {
        const poll = post.poll;
        let uniqueVoters = new Set();
        let totalVotesCount = 0;
        poll.options.forEach(opt => {
          const list = opt.voters || [];
          totalVotesCount += list.length;
          list.forEach(v => uniqueVoters.add(v.id));
        });

        pollContainer.innerHTML = `
          <div class="detail-poll-box">
            <div style="font-size:13px; font-weight:700; color:var(--text); display:flex; justify-content:space-between;">
              <span>📊 복수 투표 (다중 선택 가능)</span>
              <span style="font-size:11px; font-weight:normal; color:var(--text-sub);">다시 누르면 취소됩니다</span>
            </div>
            ${poll.options.map((opt, idx) => {
              const voters = opt.voters || [];
              const count = voters.length;
              const percent = uniqueVoters.size > 0 ? Math.round((count / uniqueVoters.size) * 100) : 0;
              const isVoted = voters.some(v => v.id === myDeviceId);

              const voterPills = voters.length > 0 
                ? voters.map(v => `<span class="voter-pill ${v.id === myDeviceId ? 'me' : ''}">${v.name}</span>`).join('')
                : '<span style="font-size:11px; color:#aaa;">아직 참여자 없음</span>';

              return `
                <div class="poll-card-item">
                  <div class="poll-option-row ${isVoted ? 'voted' : ''}" onclick="castToggleVote(${idx})">
                    <div class="poll-bar-fill" style="width: ${percent}%;"></div>
                    <span class="poll-opt-text">${isVoted ? '✔ ' : ''}${opt.text}</span>
                    <span class="poll-opt-count">${count}표 (${percent}%)</span>
                  </div>
                  <div class="voter-names-list">
                    <span style="font-size:11px; font-weight:600; color:var(--primary);">참여:</span> ${voterPills}
                  </div>
                </div>
              `;
            }).join('')}
            <div class="poll-meta-summary">
              <span>총 <strong>${uniqueVoters.size}명</strong> 참여</span>
              <span>(누적 ${totalVotesCount}표)</span>
            </div>
          </div>
        `;
      } else {
        pollContainer.innerHTML = '';
      }

      const gal = document.getElementById('detail-gallery');
      gal.innerHTML = (post.images || []).map((img) => `
        <div class="detail-photo-wrapper" onclick="openImageViewer('${img}')">
          <img src="${img}" loading="lazy">
          <div class="photo-zoom-icon-btn" title="크게 보기 / 다운로드">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          </div>
        </div>
      `).join('');

      const comList = document.getElementById('detail-comments-list');
      comList.innerHTML = (post.comments || []).map(c => `
        <div class="comment-item">
          <strong>${c.author}</strong>: ${makeLinksClickable(c.text)}
        </div>
      `).join('');

      document.getElementById('detail-modal').classList.add('open');
    }

    // ==========================================
    // 🔍 핀치 줌 & 제스처 확대/이동 엔진
    // ==========================================
    const viewerModal = document.getElementById('image-viewer-modal');
    const activeImg = document.getElementById('viewer-active-img');
    const downloadBtn = document.getElementById('viewer-download-link');

    let currentScale = 1;
    let posX = 0, posY = 0;
    let startX = 0, startY = 0;
    let isDragging = false;
    let initialDistance = 0;
    let initialScale = 1;
    let lastTapTime = 0;

    function applyTransform() {
      activeImg.style.transform = `translate(${posX}px, ${posY}px) scale(${currentScale})`;
    }

    function resetZoom() {
      currentScale = 1;
      posX = 0;
      posY = 0;
      applyTransform();
    }

    window.openImageViewer = (imgSrc) => {
      activeImg.src = imgSrc;
      downloadBtn.href = imgSrc;
      resetZoom();
      viewerModal.classList.add('open');
    };

    function getDistance(touches) {
      return Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
      );
    }

    // 터치 시작 (스마트폰)
    activeImg.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        // 핀치 줌 시작
        isDragging = false;
        initialDistance = getDistance(e.touches);
        initialScale = currentScale;
      } else if (e.touches.length === 1) {
        // 더블 탭 확대 감지
        const now = Date.now();
        if (now - lastTapTime < 300) {
          if (currentScale > 1) {
            resetZoom();
          } else {
            currentScale = 2.2;
            posX = 0;
            posY = 0;
            applyTransform();
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;

        // 드래그 시작
        isDragging = true;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
      }
    }, { passive: false });

    // 터치 이동
    activeImg.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 2 && initialDistance > 0) {
        // 핀치 줌 배율 계산 (최소 1배 ~ 최대 4.5배)
        const currentDistance = getDistance(e.touches);
        const factor = currentDistance / initialDistance;
        currentScale = Math.min(Math.max(initialScale * factor, 1), 4.5);
        applyTransform();
      } else if (e.touches.length === 1 && isDragging && currentScale > 1) {
        // 확대된 상태에서 손가락 드래그 이동
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        applyTransform();
      }
    }, { passive: false });

    // 터치 종료
    activeImg.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
        if (currentScale <= 1) {
          resetZoom();
        }
      }
    });

    // PC 마우스 휠 확대 & 드래그
    activeImg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.2 : 0.8;
      currentScale = Math.min(Math.max(currentScale * zoomFactor, 1), 4.5);
      if (currentScale === 1) { posX = 0; posY = 0; }
      applyTransform();
    }, { passive: false });

    activeImg.addEventListener('mousedown', (e) => {
      if (currentScale > 1) {
        isDragging = true;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging && currentScale > 1) {
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        applyTransform();
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // 더블 클릭 확대 (PC)
    activeImg.addEventListener('dblclick', () => {
      if (currentScale > 1) {
        resetZoom();
      } else {
        currentScale = 2.2;
        applyTransform();
      }
    });

    // 뷰어 닫기
    document.getElementById('viewer-close-btn').addEventListener('click', () => {
      viewerModal.classList.remove('open');
      resetZoom();
    });

    viewerModal.addEventListener('click', (e) => {
      if (e.target.id === 'image-viewer-modal' || e.target.id === 'viewer-img-container') {
        viewerModal.classList.remove('open');
        resetZoom();
      }
    });

    // 완전 복수 투표 토글
    window.castToggleVote = async (choiceIndex) => {
      if (!currentViewingDocId) return;
      const post = currentPosts.find(p => p.id === currentViewingDocId);
      if (!post || !post.poll) return;

      const opt = post.poll.options[choiceIndex];
      if (!opt.voters) opt.voters = [];

      const alreadyVotedIndex = opt.voters.findIndex(v => v.id === myDeviceId);

      if (alreadyVotedIndex > -1) {
        opt.voters.splice(alreadyVotedIndex, 1);
      } else {
        let voterName = mySavedName;
        if (!voterName) {
          voterName = prompt("투표하시는 분의 성함(닉네임)을 입력해 주세요:");
          if (!voterName || !voterName.trim()) {
            alert("이름을 입력하셔야 투표에 반영됩니다.");
            return;
          }
          voterName = voterName.trim();
          localStorage.setItem('tte_saved_username', voterName);
          mySavedName = voterName;
        }

        opt.voters.push({
          id: myDeviceId,
          name: voterName
        });
      }

      const { doc, updateDoc } = window.fs;
      await updateDoc(doc(window.db, "posts", currentViewingDocId), {
        poll: post.poll
      });
    };

    // 좋아요
    document.getElementById('detail-like-btn').addEventListener('click', async () => {
      if (!currentViewingDocId) return;
      const { doc, updateDoc, increment } = window.fs;
      await updateDoc(doc(window.db, "posts", currentViewingDocId), {
        likes: increment(1)
      });
    });

    // 댓글 등록
    document.getElementById('comment-submit').addEventListener('click', async () => {
      if (!currentViewingDocId) return;
      const author = document.getElementById('comment-author').value.trim();
      const text = document.getElementById('comment-text').value.trim();
      if (!author || !text) return alert("이름과 내용을 입력해 주세요.");

      const { doc, updateDoc, arrayUnion } = window.fs;
      await updateDoc(doc(window.db, "posts", currentViewingDocId), {
        comments: arrayUnion({ author, text, createdAt: new Date().toISOString() })
      });
      document.getElementById('comment-text').value = '';
    });

    // 글 수정 기능
    document.getElementById('detail-edit-btn').addEventListener('click', () => {
      if (!currentViewingDocId) return;
      const post = currentPosts.find(p => p.id === currentViewingDocId);
      const inputPin = prompt("작성 시 입력했던 PIN 4자리를 입력하세요:");
      if (!inputPin) return;

      if (inputPin === post.pin) {
        editingPostId = post.id;
        document.getElementById('detail-modal').classList.remove('open');

        document.getElementById('write-modal-title').innerText = "기록 수정하기";
        document.getElementById('submit-post').innerText = "수정 완료";
        document.getElementById('post-author').value = post.author || '';
        document.getElementById('post-pin').value = post.pin || '';
        document.getElementById('post-title').value = post.title || '';
        document.getElementById('post-content').value = post.content || '';
        
        document.querySelectorAll('input[name="cat"]').forEach(r => {
          if (r.value === post.category) {
            r.checked = true;
            r.parentElement.classList.add('checked');
          } else {
            r.parentElement.classList.remove('checked');
          }
        });

        if (post.category === '투표') {
          document.getElementById('poll-builder-area').style.display = 'none';
        }

        base64Images = post.images ? [...post.images] : [];
        updateImagePreviews();

        document.getElementById('write-modal').classList.add('open');
      } else {
        alert("비밀번호가 일치하지 않습니다.");
      }
    });

    // 글 삭제
    document.getElementById('detail-delete-btn').addEventListener('click', async () => {
      if (!currentViewingDocId) return;
      const post = currentPosts.find(p => p.id === currentViewingDocId);
      const inputPin = prompt("작성 시 입력했던 PIN 4자리를 입력하세요:");
      if (!inputPin) return;

      if (inputPin === post.pin) {
        if (confirm("정말 이 기록을 삭제하시겠습니까?")) {
          const { doc, deleteDoc } = window.fs;
          await deleteDoc(doc(window.db, "posts", currentViewingDocId));
          document.getElementById('detail-modal').classList.remove('open');
          currentViewingDocId = null;
        }
      } else {
        alert("비밀번호가 일치하지 않습니다.");
      }
    });

    // 새 글쓰기 모달 열기
    document.getElementById('open-write-modal').addEventListener('click', () => {
      editingPostId = null;
      document.getElementById('write-modal-title').innerText = "새 글 남기기";
      document.getElementById('submit-post').innerText = "기록 남기기";
      document.getElementById('post-title').value = '';
      document.getElementById('post-content').value = '';
      document.getElementById('post-pin').value = '';
      base64Images = [];
      updateImagePreviews();

      if (mySavedName) document.getElementById('post-author').value = mySavedName;
      document.getElementById('write-modal').classList.add('open');
    });

    document.getElementById('close-write-modal').addEventListener('click', () => {
      editingPostId = null;
      document.getElementById('write-modal').classList.remove('open');
    });

    document.getElementById('close-detail-modal').addEventListener('click', () => {
      document.getElementById('detail-modal').classList.remove('open');
      currentViewingDocId = null;
    });
  </script>
</body>
</html>
